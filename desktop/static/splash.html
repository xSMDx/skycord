<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No script: the window has one state and says it in HTML. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Skycord</title>
<style>
  :root { color-scheme: dark; --bg: #111214; --text: #dcddde; --muted: #abb1b8; --brand: #38b6f1; --accent: #38b6f1; --track: rgba(255,255,255,.08); --ease: cubic-bezier(.32,.72,0,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  /* The whole window drags. */
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-app-region: drag;
  }
  .stage { display: grid; justify-items: center; gap: 22px; padding-top: 10px; }
  .mark { width: 92px; height: 92px; color: var(--brand); animation: float 3.6s var(--ease) infinite alternate; }
  /* The mark blinks now and then, like the default avatar does in the app. */
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
  @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } }
  @keyframes float { from { transform: translateY(2px); } to { transform: translateY(-3px); } }
  .status { min-height: 18px; color: var(--muted); font-weight: 600; text-align: center; }
  /* Indeterminate on purpose: nothing here knows how long the window takes. */
  .bar { width: 176px; height: 4px; margin-top: -10px; overflow: hidden; border-radius: 999px; background: var(--track); }
  .bar i { display: block; width: 34%; height: 100%; border-radius: inherit; background: var(--accent); animation: sweep 1.15s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .mark, .eye, .bar i { animation: none; } }
</style>
</head>
<body>
  <main class="stage">
    <!-- The mark (src/brand/mark.ts): head and headphones solid, the eyes painted
         in the background colour so they read as its cut-out eyes and can blink. -->
    <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
      <path fill="currentColor" d="M56,150A72,72 0 0 1 200,150V170A48,48 0 0 1 152,218H104A48,48 0 0 1 56,170ZM12,170V130A17,17 0 0 1 26.47,113.19A108,108 0 0 1 229.53,113.19A17,17 0 0 1 244,130V170A17,17 0 0 1 210,170V130A17,17 0 0 1 212.99,120.38A90,90 0 0 0 43.01,120.38A17,17 0 0 1 46,130V170A17,17 0 0 1 12,170Z"/>
      <circle class="eye" cx="104" cy="156" r="14" fill="var(--bg)"/>
      <circle class="eye" cx="152" cy="156" r="14" fill="var(--bg)"/>
    </svg>
    <p class="status" role="status">Starting…</p>
    <div class="bar"><i></i></div>
  </main>
</body>
</html>
