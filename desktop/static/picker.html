<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: http: data:">
<title>Skycord</title>
<!-- In the head, blocking: it sets the mode and theme before the first paint. -->
<script src="../dist/pickerPage.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #111214; --panel: #1e2024; --raised: #2b2d31; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.18);
    --text-strong: #ffffff; --text-1: #dcddde; --text-2: #b5bac1; --text-3: #abb1b8;
    --accent: #38b6f1; --on-accent: #0e0f11; --danger: #f59697; --danger-solid: #da373c; --ok: #23a55a;
    --scroll: rgba(255,255,255,.16);
    --ease: cubic-bezier(.32,.72,0,1);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --panel: #f2f3f5; --raised: #e3e5e8; --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.2);
    --text-strong: #060607; --text-1: #313338; --text-2: #4e5058; --text-3: #5c5f66;
    --accent: #0a75af; --on-accent: #ffffff; --danger: #b8282d; --danger-solid: #da373c; --ok: #1a7f45;
    --scroll: rgba(0,0,0,.2);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text-1);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  button, input { font: inherit; color: inherit; }

  /* full: the window's page, a centred card. manage: the Servers window. */
  :root[data-mode="full"] body { display: grid; place-items: center; padding: 24px; overflow-y: auto; }
  :root[data-mode="manage"] body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .bar { display: none; }
  :root[data-mode="manage"] .bar {
    position: relative; display: flex; align-items: center; padding: 16px 24px 8px; -webkit-app-region: drag;
  }
  .bar h1 { font-size: 18px; font-weight: 600; color: var(--text-strong); letter-spacing: -.01em; }
  .close {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; -webkit-app-region: no-drag;
    transition: background .12s var(--ease), color .12s var(--ease);
  }
  .close:hover { background: var(--panel); color: var(--text-strong); }
  .close svg { width: 18px; height: 18px; }
  .card { width: 100%; max-width: 460px; }
  :root[data-mode="manage"] .card { max-width: none; padding: 4px 24px 24px; overflow-y: auto; }
  :root[data-mode="manage"] .card::-webkit-scrollbar { width: 12px; }
  :root[data-mode="manage"] .card::-webkit-scrollbar-thumb { background: var(--scroll); border: 3px solid transparent; background-clip: content-box; border-radius: 999px; }
  .heading { font-size: 22px; font-weight: 700; color: var(--text-strong); }
  :root[data-mode="manage"] .heading { display: none; }
  .lede { margin: 6px 0 24px; color: var(--text-2); }
  :root[data-mode="manage"] .lede { margin: 0 0 20px; font-size: 14px; }
  .section { margin: 20px 0 10px; color: var(--text-3); font-size: 13px; font-weight: 600; }
  .section:first-child { margin-top: 0; }

  /* saved servers */
  .servers { display: grid; gap: 8px; padding: 0; list-style: none; }
  .server {
    display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 10px 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  }
  .mark {
    flex: none; width: 40px; height: 40px; display: grid; place-items: center; overflow: hidden; border-radius: 11px;
    background: var(--raised); color: var(--text-strong); font-weight: 700; font-size: 16px;
  }
  .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mark.hosted { color: #5865f2; }
  .mark.hosted svg { width: 26px; height: 26px; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .who strong, .who span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .who strong { color: var(--text-strong); font-weight: 600; font-size: 15px; }
  .who span { color: var(--text-3); font-size: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; color: var(--text-2); font-size: 13px; font-weight: 600; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .icon-btn {
    flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px;
    background: transparent; color: var(--text-2); cursor: pointer; transition: background .12s var(--ease), color .12s var(--ease);
  }
  .icon-btn:hover { background: var(--raised); color: var(--text-strong); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn svg { width: 17px; height: 17px; }
  .server.editing, .server.confirming { display: block; padding: 14px; }
  .edit { display: grid; gap: 10px; }
  .edit label { display: grid; gap: 4px; color: var(--text-3); font-size: 12px; font-weight: 600; }
  .confirm p { color: var(--text-1); font-size: 14px; }
  .confirm strong { color: var(--text-strong); }
  .confirm .row, .edit .row { margin-top: 12px; }
  .edit .row { margin-top: 2px; }

  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 8px;
    padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); text-align: left; cursor: pointer;
    transition: border-color .12s var(--ease), background .12s var(--ease);
  }
  .choice:hover { border-color: var(--line-strong); background: var(--raised); }
  .choice strong { display: block; color: var(--text-strong); font-weight: 600; }
  .choice span { color: var(--text-3); font-size: 13px; }
  form.add { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--bg); color: var(--text-strong);
  }
  input::placeholder { color: var(--text-3); }
  .btn {
    flex: none; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600;
    background: var(--accent); color: var(--on-accent); transition: filter .12s var(--ease), background .12s var(--ease);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.small { padding: 7px 12px; border-radius: 8px; font-size: 13px; }
  .btn.quiet { background: transparent; color: var(--text-2); }
  .btn.quiet:hover { background: var(--raised); color: var(--text-strong); filter: none; }
  .btn.danger { background: var(--danger-solid); color: #ffffff; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 13px; color: var(--text-2); }
  .msg:empty { min-height: 0; margin: 0; }
  .add + .msg:empty { min-height: 22px; margin-top: 10px; }
  .msg.err { color: var(--danger); }
  .found { display: none; margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .found.on { display: block; }
  .found .who-row { display: flex; align-items: center; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="bar">
    <h1>Servers</h1>
    <button class="close" id="close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <main class="card">
    <h1 class="heading">Choose a server</h1>
    <p class="lede" id="lede">Skycord runs on the hosted server, or on one you or a friend runs.</p>

    <section id="saved" hidden>
      <h2 class="section">Your servers</h2>
      <ul class="servers" id="servers"></ul>
      <p class="msg" id="list-msg" role="status" aria-live="polite"></p>
    </section>

    <button class="choice" id="hosted" type="button">
      <span class="mark hosted" aria-hidden="true"><svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M24,64a24,24,0,0,1,48,0H184a24,24,0,0,1,48,0v80a64,64,0,0,1-64,64H88a64,64,0,0,1-64-64Z"/><circle cx="92" cy="140" r="10" fill="currentColor" stroke="none"/><circle cx="164" cy="140" r="10" fill="currentColor" stroke="none"/></svg></span>
      <div><strong>skycord.xyz</strong><span>The hosted server</span></div>
    </button>

    <h2 class="section" id="add-label">Or enter your own server's address</h2>
    <form class="add" id="form">
      <input id="address" type="text" inputmode="url" autocomplete="url" spellcheck="false"
             placeholder="chat.example.com" aria-labelledby="add-label" required>
      <button class="btn" id="check" type="submit">Check</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <section class="found" id="found" aria-live="polite">
      <div class="who-row">
        <span class="mark" id="mark"></span>
        <div class="who"><strong id="name"></strong><span id="meta"></span></div>
      </div>
      <div class="row">
        <button class="btn" id="go" type="button">Continue</button>
        <button class="btn quiet" id="save" type="button" hidden>Save</button>
        <button class="btn quiet" id="back" type="button">Use a different address</button>
      </div>
    </section>
  </main>
</body>
</html>
