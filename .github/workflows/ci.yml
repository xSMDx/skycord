# The repository's first CI. It publishes nothing: releases are built by
# release.yml from a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      mongo:
        # 4.4 deliberately: it is the floor Skycord supports, so the tests run
        # against the oldest database a self-hoster may have.
        image: mongo:4.4
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # server/config/env.ts demands these the moment server/app.ts is imported,
      # so without them every test that touches the app fails before it runs. A
      # developer machine has them in .env; a runner has nothing.
      MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-one
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-one
      # Voice endpoints answer 503 when these are empty, which is right, and
      # eleven failing tests here. Nothing connects to LiveKit; the tests only
      # mint tokens, which is local signing.
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfiles name registry.npmjs.org and nothing else: npm swaps that
      # host for whatever registry a machine is configured with, so every
      # machine can install. A mirror's host written into the lock is fetched
      # as-is everywhere. On 3 October an Iranian mirror landed in 288 entries;
      # CI stayed green on a warm cache until the cache was evicted, and then
      # npm hung for five minutes on the mirror and died.
      - name: Lockfiles point at the npm registry
        run: |
          bad=$(grep -hoE '"resolved": "https?://[^/"]+' package-lock.json music/package-lock.json desktop/package-lock.json \
            | grep -v '"resolved": "https://registry.npmjs.org' | sort | uniq -c || true)
          if [ -n "$bad" ]; then echo "Lockfile entries resolve outside registry.npmjs.org:"; echo "$bad"; exit 1; fi
      - run: npm ci
      # The music service is its own package with its own lockfile, and the
      # typecheck covers it (tsconfig.music.json). Without its dependencies,
      # @livekit/rtc-node is missing and every run since music landed failed
      # here, before a single test ran.
      - name: Install the music service's dependencies
        run: npm ci --prefix music
      - name: Typecheck (client, server and music)
        run: npm run typecheck
      - name: Client tests
        run: npx vitest run src/
      - name: Server tests
        run: npx vitest run server/
      # The desktop shell's pure modules (address handling, the security
      # rules). They import nothing from Electron, so they run here without it.
      - name: Desktop tests
        run: npx vitest run desktop/src

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same checks the release runs, on every pull request: a broken
      # installer found at tag time is a release that has to be renumbered.
      - name: Script tests
        run: bash deploy/tests/cli.test.sh
      - name: ShellCheck
        # Pinned, and the same image a developer runs: apt's version differs
        # between runner images and flags different things.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            deploy/install.sh deploy/skycord deploy/mongo-init.sh \
            deploy/music-firewall.sh deploy/tests/*.sh

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: SKYCORD_VERSION=ci
          # Scoped per image: one shared gha cache between two unrelated
          # builds means each evicts the other's layers. Same scope names as
          # the release workflow, so a tag build can reuse what CI warmed.
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # The music service's Dockerfile had never once built, and nothing
      # would have said so until a release tag tried it: this job built only
      # the app. A tag is a bad place to find that out, so both are built.
      - name: Build the music service (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: music/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=music
          cache-to: type=gha,mode=max,scope=music
