# The repository's first CI. It publishes nothing: releases are built by
# release.yml from a version tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      mongo:
        # 4.4 deliberately: it is the floor Skycord supports, so the tests run
        # against the oldest database a self-hoster may have.
        image: mongo:4.4
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # server/config/env.ts demands these the moment server/app.ts is imported,
      # so without them every test that touches the app fails before it runs. A
      # developer machine has them in .env; a runner has nothing.
      MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-one
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-one
      # Voice endpoints answer 503 when these are empty, which is right, and
      # eleven failing tests here. Nothing connects to LiveKit; the tests only
      # mint tokens, which is local signing.
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (client and server)
        run: npm run typecheck
      - name: Client tests
        run: npx vitest run src/
      - name: Server tests
        run: npx vitest run server/

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same checks the release runs, on every pull request: a broken
      # installer found at tag time is a release that has to be renumbered.
      - name: Script tests
        run: bash deploy/tests/cli.test.sh
      - name: ShellCheck
        # Pinned, and the same image a developer runs: apt's version differs
        # between runner images and flags different things.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            deploy/install.sh deploy/skycord deploy/mongo-init.sh deploy/tests/*.sh

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: SKYCORD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
