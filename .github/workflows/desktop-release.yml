# The Windows app's release. A tag like desktop-v0.20.0 builds the installer on
# Windows and publishes it, with the update feed, to the public releases-only
# repo — the source repo stays private (owner decision, 2026-09-21).
#
# DESKTOP_RELEASES_TOKEN is a fine-grained token with Contents: read and write
# on xSMDx/skycord-desktop-releases and nothing else.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version from the tag
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "v=$v" >> "$GITHUB_OUTPUT"
      # electron-builder uploads its files in parallel, and each creates the
      # release if it can't find one. Two creations race and GitHub refuses the
      # second ("Published releases must have a valid tag") after the first has
      # already published a release holding half the files (rc.1, 2026-09-21).
      # So the release exists as a draft before electron-builder starts, it only
      # uploads into it, and the release goes public once every file is there.
      - name: Draft the release
        shell: bash
        run: |
          gh release list -R "$REPO" --json tagName --jq '.[].tagName' | grep -qx "v$V" ||
            gh release create "v$V" -R "$REPO" --draft --title "Skycord for Windows $V"               --notes "Download **Skycord-Setup-$V.exe** below and run it. Installed copies update themselves."
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          V: ${{ steps.version.outputs.v }}
          REPO: xSMDx/skycord-desktop-releases
      - name: Build and upload
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
      - name: Publish the release
        shell: bash
        run: gh release edit "v$V" -R "$REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
          V: ${{ steps.version.outputs.v }}
          REPO: xSMDx/skycord-desktop-releases
