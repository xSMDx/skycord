# A release is a version tag. This builds it, rehearses an install and an
# update against the built image, and only then publishes anything.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the release
  packages: write   # push the image

env:
  # Built per job by lowercasing the owner — see the note in "Version tags".
  IMAGE_NAME: skycord

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:4.4
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # server/config/env.ts demands these the moment server/app.ts is imported,
      # so without them every test that touches the app fails before it runs. A
      # developer machine has them in .env; a runner has nothing.
      MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/sykord_test
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-one
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-one
      # Voice endpoints answer 503 when these are empty, which is right, and
      # eleven failing tests here. Nothing connects to LiveKit; the tests only
      # mint tokens, which is local signing.
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/
      - run: npx vitest run server/
      - name: Script tests
        run: bash deploy/tests/cli.test.sh
      - name: ShellCheck
        # Pinned, and the same image a developer runs: apt's version differs
        # between runner images and flags different things.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            deploy/install.sh deploy/skycord deploy/mongo-init.sh deploy/tests/*.sh

  build:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version tags
        id: tags
        run: |
          # xSMDx/skycord is a valid repository and an invalid image name:
          # Docker requires lowercase. Workflow expressions have no function
          # for that, so the name is assembled here and passed on.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}"
          V="${GITHUB_REF_NAME}"
          MINOR="${V%.*}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "list=$IMAGE:$V,$IMAGE:$MINOR" >> "$GITHUB_OUTPUT"
      - name: Build for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          build-args: SKYCORD_VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rehearse:
    name: Install, update and roll back for real
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is private until someone makes it public, and every first
      # release starts that way. The installer runs under sudo, so it is
      # root that has to be signed in, not the runner user.
      - name: Sign in to the registry as root, who runs the installer
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Rehearse
        run: |
          bash deploy/tests/rehearsal.sh \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}" "${GITHUB_REF_NAME}"

  publish:
    name: Publish the release
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME}"
      - name: Gather the assets a server downloads
        run: |
          mkdir -p out
          cp deploy/compose*.yaml deploy/mongo-init.sh deploy/Caddyfile.tmpl \
             deploy/livekit.yaml.tmpl deploy/skycord deploy/install.sh out/
          cp deploy/systemd/* out/
          printf '%s\n' "${GITHUB_REF_NAME}" > out/VERSION
          cd out && sha256sum ./* > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Install:

                curl -fsSL https://skycord.xyz/install.sh | sudo bash

            Update an existing server:

                sudo skycord update

            The changelog for this release is on https://skycord.xyz (Changelog tab).
