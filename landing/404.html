<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nothing here — Skycord</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#111214" />
<!-- Inline, so a 404 never fires a second request that could also 404. Sky
     (#38b6f1), which is the brand since v0.20.0 — index.html still carries the
     old Blurple here. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='none' stroke='%2338b6f1' stroke-linecap='round' stroke-linejoin='round' stroke-width='16' d='M24,64a24,24,0,0,1,48,0H184a24,24,0,0,1,48,0v80a64,64,0,0,1-64,64H88a64,64,0,0,1-64-64Z'/%3E%3Ccircle cx='92' cy='140' r='12' fill='%2338b6f1'/%3E%3Ccircle cx='164' cy='140' r='12' fill='%2338b6f1'/%3E%3C/svg%3E" />
<!--
  Deliberately self-contained: its own tokens, its own font faces, no shared
  stylesheet. A 404 is the one page that has to render when something else is
  missing or half-deployed, so it depends on nothing but itself and two font
  files — and it keeps working through a redesign of index.html rather than
  breaking with it. It will want a visual pass when that redesign lands.
-->
<style>
  @font-face { font-family: 'Archivo'; src: url(fonts/archivo-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Archivo'; src: url(fonts/archivo-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

  :root {
    --bg-floor: #111214;
    --bg-panel: #2b2d31;
    --text-strong: #ffffff;
    --text-2: #b5bac1;
    --text-3: #949ba4;
    --accent: #38b6f1;
    --accent-hover: #31a0d4;
    --on-accent: #0e0f11;
    --ease-out: cubic-bezier(.32, .72, 0, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-floor);
    color: var(--text-2);
    font-family: 'Archivo', system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: 48px 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 440px; text-align: center; }

  .mark {
    width: 56px; height: 56px; margin: 0 auto 28px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: rgba(56, 182, 241, .12);
    color: var(--accent);
  }
  .mark svg { width: 30px; height: 30px; }

  .code {
    font-size: 13px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--text-3); margin: 0 0 10px;
  }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; font-weight: 600; color: var(--text-strong); }
  p { margin: 0 0 28px; font-size: 15px; }

  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 11px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background var(--dur, 180ms) var(--ease-out), transform 140ms var(--ease-out);
  }
  a:active { transform: scale(.97); }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:hover { background: var(--accent-hover); }
  .ghost { background: var(--bg-panel); color: var(--text-strong); }
  .ghost:hover { background: #35373c; }

  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { a { transition: none; } a:active { transform: none; } }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <p class="code">Error 404</p>
    <h1>There's nothing at this address</h1>
    <p>The page may have moved, or the link that brought you here may have been wrong. Everything Skycord has is one click away.</p>
    <div class="row">
      <a class="primary" href="/">Back to skycord.xyz</a>
      <a class="ghost" href="https://github.com/xSMDx/skycord-desktop-releases/releases/latest">Download the app</a>
    </div>
  </main>
</body>
</html>
